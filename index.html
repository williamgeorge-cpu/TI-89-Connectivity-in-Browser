<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI-89 Titanium WebUSB Link</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .status { margin-top: 20px; padding: 10px; border-left: 4px solid #007bff; background: #e9ecef; white-space: pre-line; }
        input[type="file"] { margin: 15px 0; display: block; }
    </style>
</head>
<body>
<div class="container">
    <h2>TI-89 Titanium File Sender</h2>
    <p>Connect your TI-89 Titanium via USB, click "Connect", and select a file to transmit.</p>
    <button id="connectBtn">Connect Calculator</button>
    <input type="file" id="fileInput" disabled />
    <button id="sendBtn" disabled>Send File</button>
    <div class="status" id="statusLog">Status: Disconnected</div>
</div>

<script>
const TI_VENDOR_ID = 0x0451;
const TI_89_PIDS = [0xe004, 0xe00e];
let usbDevice = null;
let endpointOut = null;
let endpointIn = null;

const connectBtn = document.getElementById('connectBtn');
const sendBtn = document.getElementById('sendBtn');
const fileInput = document.getElementById('fileInput');
const statusLog = document.getElementById('statusLog');

function log(message) {
    statusLog.textContent = `Status: ${message}`;
}

connectBtn.addEventListener('click', async () => {
    try {
        const filters = TI_89_PIDS.map(pid => ({ vendorId: TI_VENDOR_ID, productId: pid }));
        usbDevice = await navigator.usb.requestDevice({ filters: filters });
        await usbDevice.open();
        if (usbDevice.configuration === null) {
            await usbDevice.selectConfiguration(1);
        }
        await usbDevice.claimInterface(0);
        
        const activeInterface = usbDevice.configuration.interfaces.find(i => i.interfaceNumber === 0);
        const alternate = activeInterface.alternates[0];
        const outEp = alternate.endpoints.find(e => e.direction === 'out');
        const inEp = alternate.endpoints.find(e => e.direction === 'in');
        
        if (!outEp || !inEp) throw new Error("Endpoints missing.");
        endpointOut = outEp.endpointNumber;
        endpointIn = inEp.endpointNumber;
        
        log(`Connected to ${usbDevice.productName || 'TI-89 Titanium'}\nReady to send.`);
        fileInput.disabled = false;
        sendBtn.disabled = false;
    } catch (error) {
        console.error(error);
        log(`Connection failed: ${error.message}`);
    }
});

sendBtn.addEventListener('click', async () => {
    if (!usbDevice || !fileInput.files.length) {
        log("Please connect a device and select a file first.");
        return;
    }
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = async (event) => {
        const fileBytes = new Uint8Array(event.target.result);
        try {
            log(`Parsing file structure...`);
            await transferTI89File(fileBytes);
        } catch (error) {
            console.error(error);
            log(`Transfer error: ${error.message}`);
        }
    };
    reader.readAsArrayBuffer(file);
});

function makeUSBDirectPacket(cmd, dataBytes = new Uint8Array(0)) {
    const payloadLen = dataBytes.length;
    const linkPacketLen = 4 + payloadLen + 2; 
    const packet = new Uint8Array(4 + linkPacketLen);
    
    // 1. USB Link Layer Wrapper Header
    packet[0] = 0x21; 
    packet[1] = 0x01; 
    packet[2] = linkPacketLen & 0xFF;
    packet[3] = (linkPacketLen >> 8) & 0xFF;
    
    // 2. Calculator Standard Packet Frame
    packet[4] = 0x08; 
    packet[5] = cmd; 
    packet[6] = payloadLen & 0xFF;
    packet[7] = (payloadLen >> 8) & 0xFF;
    
    // 3. Set the variables payload
    packet.set(dataBytes, 8);
    
    // 4. Compute 16-bit lower-checksum of the payload data
    let checksum = 0;
    for (let i = 0; i < payloadLen; i++) {
        checksum = (checksum + dataBytes[i]) & 0xFFFF;
    }
    packet[8 + payloadLen] = checksum & 0xFF;
    packet[9 + payloadLen] = (checksum >> 8) & 0xFFFF;
    
    return packet;
}

async function transferTI89File(rawFileBytes) {
    if (rawFileBytes.length < 0x5A) {
        throw new Error("Invalid or corrupt TI file layout length.");
    }

    const dataLenLSB = rawFileBytes[0x44];
    const dataLenMSB = rawFileBytes[0x45];
    const variableDataLength = dataLenLSB | (dataLenMSB << 8);
    const rtsPayload = rawFileBytes.slice(0x4A, 0x5A);
    const dataPayload = rawFileBytes.slice(0x5A, 0x5A + variableDataLength);

    // Parses a incoming USB buffer, pulling out all sequential Command IDs inside it
    function parseCommandIDs(result) {
        const cmds = [];
        if (!result || result.status !== 'ok' || !result.data) return cmds;
        const view = result.data;
        let offset = 0;
        while (offset + 6 <= view.byteLength) {
            if (view.getUint8(offset) === 0x21) {
                const linkPacketLen = view.getUint8(offset + 2) | (view.getUint8(offset + 3) << 8);
                const cmd = view.getUint8(offset + 5);
                cmds.push(cmd);
                offset += 4 + linkPacketLen; 
            } else {
                break;
            }
        }
        return cmds;
    }

    // 1. Send Request to Send (RTS)
    log("Sending Request to Send (RTS)...");
    const rtsPacket = makeUSBDirectPacket(0x06, rtsPayload);
    await usbDevice.transferOut(endpointOut, rtsPacket);

    // 2. Read the calculator's response sequence (Handles combined ACK + CTS buffers)
    log("Waiting for Clear To Send (CTS)...");
    let hasCTS = false;
    let attempts = 0;
    
    while (!hasCTS && attempts < 5) {
        attempts++;
        let response = await usbDevice.transferIn(endpointIn, 64);
        let receivedCmds = parseCommandIDs(response);
        
        if (receivedCmds.includes(0x09)) {
            hasCTS = true;
            break;
        }
        if (receivedCmds.includes(0x56)) {
            continue; // Got ACK standalone; loop once more to capture the separated CTS packet
        }
        if (receivedCmds.length > 0) {
            throw new Error(`Calculator rejected transmission. Got codes: ${receivedCmds.map(c => '0x' + c.toString(16)).join(', ')}`);
        }
    }

    if (!hasCTS) {
        throw new Error("Timed out waiting for Clear To Send (CTS) packet.");
    }

    // 3. Acknowledge the CTS back to the calculator
    log("Acknowledging CTS...");
    const ackPacket = makeUSBDirectPacket(0x56, new Uint8Array(0));
    await usbDevice.transferOut(endpointOut, ackPacket);

    // 4. Send actual data payload
    log("Sending variable data payloads...");
    const dataPacket = makeUSBDirectPacket(0x15, dataPayload);
    await usbDevice.transferOut(endpointOut, dataPacket);

    // 5. Read calculator's final ACK for the data payload
    log("Waiting for data acknowledgment...");
    let finalResponse = await usbDevice.transferIn(endpointIn, 64);
    let finalCmds = parseCommandIDs(finalResponse);
    
    if (finalCmds.includes(0x56)) {
        log("File sent and successfully accepted by TI-89 Titanium!");
    } else if (finalCmds.length > 0) {
        log(`Data transmitted, but unexpected final code: 0x${finalCmds[0].toString(16)}`);
    } else {
        throw new Error("No final receipt acknowledgement from the calculator.");
    }
}
</script>
</body>
</html>
