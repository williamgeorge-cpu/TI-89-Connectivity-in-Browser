<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI-89 Titanium Reactive WebUSB Link</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #e65c00; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #cc5200; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin-top: 20px; padding: 10px; border-left: 4px solid #e65c00; background: #e9ecef; white-space: pre-line; font-family: monospace; height: 200px; overflow-y: auto; }
        input[type="file"] { margin: 15px 0; display: block; }
    </style>
</head>
<body>
<div class="container">
    <h2>TI-89 Titanium Reactive Sender</h2>
    <p>Architecture: Continuous Inbound Reactive Architecture</p>
    <button id="connectBtn">Connect & Initialize Pump</button>
    <input type="file" id="fileInput" disabled />
    <button id="sendBtn" disabled>Transmit File</button>
    <div class="status" id="statusLog">Status: Standby.</div>
</div>

<script>
const TI_VENDOR_ID = 0x0451;
const TI_89_PIDS = [0xe004, 0xe00e];

let usbDevice = null;
let endpointOut = null;
let endpointIn = null;
let isPolling = false;

let currentTxState = 'IDLE';
let cachedDataPayload = null;

const connectBtn = document.getElementById('connectBtn');
const sendBtn = document.getElementById('sendBtn');
const fileInput = document.getElementById('fileInput');
const statusLog = document.getElementById('statusLog');

function log(message) {
    statusLog.textContent += `\n[${new Date().toLocaleTimeString()}] ${message}`;
    statusLog.scrollTop = statusLog.scrollHeight;
}

connectBtn.addEventListener('click', async () => {
    try {
        const filters = TI_89_PIDS.map(pid => ({ vendorId: TI_VENDOR_ID, productId: pid }));
        usbDevice = await navigator.usb.requestDevice({ filters: filters });
        await usbDevice.open();
        
        if (usbDevice.configuration === null) {
            await usbDevice.selectConfiguration(1);
        }
        await usbDevice.claimInterface(0);

        const activeInterface = usbDevice.configuration.interfaces.find(i => i.interfaceNumber === 0);
        const alternate = activeInterface.alternates[0];
        
        endpointOut = alternate.endpoints.find(e => e.direction === 'out').endpointNumber;
        endpointIn = alternate.endpoints.find(e => e.direction === 'in').endpointNumber;

        log(`Connected. Initializing reactive background reader...`);
        isPolling = true;
        startBackgroundReader();

        log("Waking up hardware link layer...");
        await usbDevice.transferOut(endpointOut, new Uint8Array([0x21, 0x01, 0x00, 0x00])); 
        
        fileInput.disabled = false;
        sendBtn.disabled = false;
    } catch (error) {
        log(`Init Failure: ${error.message}`);
    }
});

sendBtn.addEventListener('click', async () => {
    if (!usbDevice || !fileInput.files.length) return;
    const file = fileInput.files[0];
    const reader = new FileReader();
    
    reader.onload = async (event) => {
        const rawBytes = new Uint8Array(event.target.result);
        if (rawBytes.length < 0x5A) {
            log("Error: File sizing does not conform to standard TI targets.");
            return;
        }

        const dataLen = rawBytes[0x44] | (rawBytes[0x45] << 8);
        const rtsPayload = rawBytes.slice(0x4A, 0x5A);
        cachedDataPayload = rawBytes.slice(0x5A, 0x5A + dataLen);

        currentTxState = 'AWAITING_CTS';
        log("State changed -> AWAITING_CTS. Transmitting RTS...");
        
        const rtsPacket = makeUSBDirectPacket(0x06, rtsPayload);
        await usbDevice.transferOut(endpointOut, rtsPacket);
    };
    reader.readAsArrayBuffer(file);
});

async function startBackgroundReader() {
    while (isPolling) {
        try {
            let result = await usbDevice.transferIn(endpointIn, 64);
            if (result.status === 'ok' && result.data.byteLength > 0) {
                parseIncomingBytes(new Uint8Array(result.data.buffer));
            } else {
                await new Promise(r => setTimeout(r, 10));
            }
        } catch (err) {
            if (err.message.includes("active") || err.message.includes("disconnected")) {
                log(`Pump halted: ${err.message}`);
                isPolling = false;
            } else {
                await new Promise(r => setTimeout(r, 10));
            }
        }
    }
}

function parseIncomingBytes(bytes) {
    let offset = 0;
    while (offset < bytes.length) {
        if (bytes[offset] === 0x21 && bytes[offset + 1] === 0x01) {
            const usbWrapperLen = bytes[offset + 2] | (bytes[offset + 3] << 8);
            if (offset + 4 + usbWrapperLen > bytes.length) break;
            
            // Fixed Command index mapping to reflect precise protocol layout
            const cmd = bytes[offset + 5]; 
            log(`Pump captured incoming packet Command ID: 0x${cmd.toString(16).toUpperCase()}`);
            handleProtocolState(cmd);
            
            offset += 4 + usbWrapperLen;
        } else {
            offset++;
        }
    }
}

async function handleProtocolState(incomingCmd) {
    if (currentTxState === 'AWAITING_CTS' && incomingCmd === 0x09) {
        currentTxState = 'SENDING_ACK_AND_DATA';
        log("CTS Received! Advancing -> SENDING_ACK_AND_DATA");
        
        const ackPacket = makeUSBDirectPacket(0x56);
        await usbDevice.transferOut(endpointOut, ackPacket);
        
        log("Pushing data payload block...");
        const dataPacket = makeUSBDirectPacket(0x15, cachedDataPayload);
        await usbDevice.transferOut(endpointOut, dataPacket);
        
        currentTxState = 'AWAITING_FINAL_ACK';
        return;
    }

    if (currentTxState === 'AWAITING_FINAL_ACK' && incomingCmd === 0x56) {
        currentTxState = 'IDLE';
        log("SUCCESS! Final ACK verified. Transmission sequence finalized cleanly.");
        return;
    }
}

function makeUSBDirectPacket(cmd, dataBytes = new Uint8Array(0)) {
    const payloadLen = dataBytes.length;
    
    // TI standard protocol header = Machine Target (1) + Command ID (1) + Payload Length (2)
    const tiFrameLen = 4 + payloadLen; 
    const usbWrapperLen = tiFrameLen + 2; // + 2 for the checksum trailing bytes
    
    const packet = new Uint8Array(4 + usbWrapperLen);
    
    // WebUSB Hardware Container Wrapper
    packet[0] = 0x21;
    packet[1] = 0x01;
    packet[2] = usbWrapperLen & 0xFF;
    packet[3] = (usbWrapperLen >> 8) & 0xFF;
    
    // TI Link Layer Framing Protocol
    packet[4] = 0x08; // Destination: Calculator
    packet[5] = cmd;  // Command ID
    packet[6] = payloadLen & 0xFF;
    packet[7] = (payloadLen >> 8) & 0xFF;
    
    // Inject Variable Data
    packet.set(dataBytes, 8);
    
    // Calculate Checksum over the entire TI Frame layer
    let checksum = 0;
    for (let i = 4; i < 4 + tiFrameLen; i++) {
        checksum = (checksum + packet[i]) & 0xFFFF;
    }
    
    packet[4 + tiFrameLen] = checksum & 0xFF;
    packet[5 + tiFrameLen] = (checksum >> 8) & 0xFF;
    
    return packet;
}
</script>
</body>
</html>
