<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI-89 WebUSB Link Utility</title>
    <style>
        body { font-family: sans-serif; margin: 30px; line-height: 1.6; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        button { display: block; width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; cursor: pointer; }
        #status { font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h2>TI-89 Link Utility</h2>
        <p>Status: <span id="status">Disconnected</span></p>
        <button id="connectBtn">Connect to TI-89</button>
        <hr>
        <label for="fileInput">Select TI-89 File (.89g, .89z, etc.):</label>
        <input type="file" id="fileInput" disabled>
        <button id="sendBtn" disabled>Send File to Calculator</button>
    </div>
    <script>
        const TI_VENDOR_ID = 0x0451; 
        let device;
        let fileData = null;
        let outEndpointNumber = null;
        let inEndpointNumber = null;

        const connectBtn = document.getElementById('connectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('status');

        const delay = ms => new Promise(res => setTimeout(res, ms));

        connectBtn.addEventListener('click', async () => {
            try {
                statusText.textContent = "Requesting device pairing...";
                device = await navigator.usb.requestDevice({ filters: [{ vendorId: TI_VENDOR_ID }] });
                await device.open();
                
                if (device.configuration === null) {
                    await device.selectConfiguration(device.configurations[0].configurationValue);
                }
                
                const intf = device.configuration.interfaces[0];
                await device.claimInterface(intf.interfaceNumber);
                
                const outEp = intf.alternate.endpoints.find(e => e.direction === 'out');
                const inEp = intf.alternate.endpoints.find(e => e.direction === 'in');
                
                if (!outEp || !inEp) {
                    throw new Error("Required endpoints not found on this interface.");
                }
                
                outEndpointNumber = outEp.endpointNumber;
                inEndpointNumber = inEp.endpointNumber;
                
                statusText.textContent = `Connected: ${device.productName || 'TI Device'}`;
                statusText.style.color = "green";
                fileInput.disabled = false;
            } catch (error) {
                console.error(error);
                statusText.textContent = `Connection failed: ${error.message}`;
                statusText.style.color = "red";
            }
        });

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                fileData = new Uint8Array(e.target.result);
                sendBtn.disabled = false;
                statusText.textContent = `Loaded ${file.name} (${fileData.length} bytes)`;
                statusText.style.color = "black";
            };
            reader.readAsArrayBuffer(file);
        });

        sendBtn.addEventListener('click', async () => {
            if (!device || !fileData) return;
            try {
                statusText.style.color = "black";
                
                if (fileData.length < 80) throw new Error("Invalid TI file size (too small).");
                const signature = String.fromCharCode(...fileData.subarray(0, 8));
                if (!signature.startsWith("**TI89**")) {
                    throw new Error("Unsupported or corrupted TI file signature.");
                }

                const dataSectionLen = fileData[74] | (fileData[75] << 8);
                const varHeaderOffset = 76;
                const varHeaderLen = 22; 
                const varHeaderContent = fileData.subarray(varHeaderOffset, varHeaderOffset + varHeaderLen);
                
                const dataOffset = varHeaderOffset + varHeaderLen;
                const actualVarData = fileData.subarray(dataOffset, dataOffset + dataSectionLen - varHeaderLen);

                // Phase 1: RTS Header
                statusText.textContent = "Sending variable header...";
                const rtsPacket = buildTiPacket(0x08, 0x06, varHeaderContent);
                await device.transferOut(outEndpointNumber, rtsPacket);
                
                statusText.textContent = "Waiting for Header ACK...";
                await waitForAck();

                // Phase 2: Send Data 
                statusText.textContent = "Sending file data...";
                const dataPacket = buildTiPacket(0x08, 0x15, actualVarData);
                await device.transferOut(outEndpointNumber, dataPacket);
                
                statusText.textContent = "Waiting for Data ACK...";
                await waitForAck();

                // Phase 3: EOT
                statusText.textContent = "Finalizing transfer...";
                const eotPacket = buildTiPacket(0x08, 0x92, new Uint8Array(0));
                await device.transferOut(outEndpointNumber, eotPacket);
                await waitForAck();

                statusText.textContent = "Transfer successful!";
                statusText.style.color = "blue";
            } catch (error) {
                console.error(error);
                statusText.textContent = `Transfer Error: ${error.message}`;
                statusText.style.color = "red";
            }
        });

        async function waitForAck() {
            // Tiny physical pause so the calculator can process the command register
            await delay(30); 
            
            const readResult = await device.transferIn(inEndpointNumber, 64);
            if (readResult.status !== 'ok') {
                throw new Error(`Device read failed with status: ${readResult.status}`);
            }
            
            const data = new Uint8Array(readResult.data.buffer);
            if (data.length >= 2) {
                const commandId = data[1];
                if (commandId === 0x5A) {
                    throw new Error("The calculator rejected the file (Memory full or duplicate name).");
                }
                if (commandId !== 0x56) {
                    throw new Error(`Unexpected handshake response code: 0x${commandId.toString(16).toUpperCase()}`);
                }
            } else {
                throw new Error("Received an incomplete or empty packet header.");
            }
        }

        function buildTiPacket(machineId, commandId, dataBytes) {
            const headerLength = 4;
            const checksumLength = 2;
            const totalLength = headerLength + dataBytes.length + checksumLength;
            const packet = new Uint8Array(totalLength);
            
            packet[0] = machineId;
            packet[1] = commandId;
            
            // TI-89 Link Protocol defines length field as the payload size
            packet[2] = dataBytes.length & 0xFF;
            packet[3] = (dataBytes.length >> 8) & 0xFF;
            
            packet.set(dataBytes, headerLength);
            
            let checksum = 0;
            for (let i = 0; i < dataBytes.length; i++) {
                checksum = (checksum + dataBytes[i]) & 0xFFFF;
            }
            
            packet[totalLength - 2] = checksum & 0xFF;
            packet[totalLength - 1] = (checksum >> 8) & 0xFF;
            
            return packet;
        }
    </script>
</body>
</html>
