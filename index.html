<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI-89 Titanium WebUSB Link</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .status { margin-top: 20px; padding: 10px; border-left: 4px solid #007bff; background: #e9ecef; }
        input[type="file"] { margin: 15px 0; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>TI-89 Titanium File Sender</h2>
    <p>Connect your TI-89 Titanium via USB, click "Connect", and select a file (.89i, .89t, .89z, etc.) to transmit.</p>
    
    <button id="connectBtn">Connect Calculator</button>
    <input type="file" id="fileInput" disabled />
    <button id="sendBtn" disabled>Send File</button>

    <div class="status" id="statusLog">Status: Disconnected</div>
</div>

<script>
    // TI-89 Titanium USB Vendor ID (Texas Instruments) and Product ID
    const TI_VENDOR_ID = 0x0451; 
    const TI_89_PRODUCT_ID = 0xe008; // Typical SilverLink/Direct USB PID

    let usbDevice = null;

    const connectBtn = document.getElementById('connectBtn');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const statusLog = document.getElementById('statusLog');

    function log(message) {
        statusLog.textContent = `Status: ${message}`;
    }

    // 1. Request connection to the calculator
    connectBtn.addEventListener('click', async () => {
        try {
            usbDevice = await navigator.usb.requestDevice({
                filters: [{ vendorId: TI_VENDOR_ID, productId: TI_89_PRODUCT_ID }]
            });

            await usbDevice.open();
            // Select configuration #1 if not already active
            if (usbDevice.configuration === null) {
                await usbDevice.selectConfiguration(1);
            }
            // Claim interface #0 (TI calculators typically expose a single custom interface)
            await usbDevice.claimInterface(0);

            log(`Connected to ${usbDevice.productName}`);
            fileInput.disabled = false;
            sendBtn.disabled = false;
        } catch (error) {
            console.error(error);
            log(`Connection failed: ${error.message}`);
        }
    });

    // 2. Read file and trigger transmission logic
    sendBtn.addEventListener('click', async () => {
        if (!usbDevice || !fileInput.files.length) {
            log("Please connect a device and select a file first.");
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async (event) => {
            const arrayBuffer = event.target.result;
            const fileBytes = new Uint8Array(arrayBuffer);

            log(`Preparing to send ${file.name} (${fileBytes.length} bytes)...`);
            
            try {
                await sendTIFile(fileBytes);
                log("File sent successfully!");
            } catch (error) {
                console.error(error);
                log(`Transfer error: ${error.message}`);
            }
        };

        reader.readAsArrayBuffer(file);
    });

    // 3. Protocol Transmission Logic
    async function sendTIFile(bytes) {
        // TI-Protocol requires a handshake/header packet before raw variable data is pushed.
        // Endpoint 1 or 2 is typically used for Outbound transfers depending on the interface configuration.
        const endpointOut = 1; 

        // NOTE: You must format 'bytes' into valid TI-Link packets.
        // A generic packet structure consists of:
        // [Machine ID] [Command ID] [Length LSB] [Length MSB] [Data...] [Checksum LSB] [Checksum MSB]
        
        log("Sending packet header...");
        // Example: Sending the raw bytes directly (Requires the file to already contain the 
        // proper native TI variable headers if sending unpacketized data stream)
        const result = await usbDevice.transferOut(endpointOut, bytes);
        
        if (result.status !== 'ok') {
            throw new Error("USB transfer failed packet delivery.");
        }
    }
</script>
</body>
</html>
